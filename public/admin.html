<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>研究管理后台</title><link rel="stylesheet" href="/css/app.css?v=5.0"></head>
<body>
<div id="login" class="login-shell"><section class="card login-card"><h1>管理员登录</h1><form id="loginForm" class="form"><input type="password" id="password" placeholder="管理员密码" required><div id="loginError" class="notice warn hidden"></div><button class="btn" style="width:100%">登录</button></form></section></div>
<div id="app" class="hidden">
<header class="topbar"><div class="brand">研究管理后台</div><button class="btn secondary" id="logout">退出</button></header>
<main class="page">
<section class="card"><span class="eyebrow">研究设置</span><h2>实验阶段开放与共同设置</h2><form class="form" id="settingsForm"><div class="grid two"><label><input type="checkbox" name="practice_open"> Practice Open</label><label><input type="checkbox" name="formal_v2_open"> Formal V2 Evidence Open</label><label><input type="checkbox" name="ai_stage_open"> AI Stage Open</label><label><input type="checkbox" name="v3_submission_open"> V3 Submission Open</label><label>Number of Test Trials<select name="number_of_test_trials"><option value="2">2</option><option value="3">3</option></select></label><label>Max Chat Minutes<input type="number" min="1" max="90" name="max_chat_minutes"></label></div><label>Shared Rules of Thumb<textarea name="shared_rules_of_thumb" placeholder="全班共同形成的设计规律，可留空"></textarea></label><button class="btn">保存研究设置</button></form></section>

<section class="card" style="margin-top:18px"><span class="eyebrow">正式匹配原则</span><h2>Q2优先，P2其次，GEHI仅辅助平衡</h2><p class="small">Q2由研究者人工评分；P2_mean由V2标准化下降时间自动计算。平台不计算Q+P总分、不计算GEHI总分，也不生成baseline_total、matching_score或任何综合分。</p></section>

<section class="card" style="margin-top:18px"><span class="eyebrow">导出研究数据</span><div class="export-grid" id="exports"></div></section>

<section class="card" style="margin-top:18px"><span class="eyebrow">批量导入匹配与组别</span><p class="small">每行写：<strong>S001 pair01 structured</strong>。三列依次为 student_id / match_pair_id / group；可用空格、Tab或英文逗号分隔。</p><textarea id="bulkText" style="width:100%;min-height:90px" placeholder="S001 pair01 structured&#10;S002 pair01 autonomous"></textarea><button class="btn secondary" id="bulkBtn">批量保存</button></section>

<section class="card" style="margin-top:18px"><span class="eyebrow">学生匹配列表</span><div class="row" style="margin-bottom:12px"><button class="btn secondary" id="sortQ2">按Q2排序</button><button class="btn secondary" id="sortP2">按P2_mean排序</button><button class="btn secondary" id="sortId">按编号排序</button></div><div id="students"></div></section>

<section class="card" id="detail" style="margin-top:18px"><p class="small">点击学生查看完整过程链、录入Q2与匹配信息。</p></section>
</main></div>
<script src="/js/common.js?v=5.0"></script><script src="/js/admin.js?v=5.0"></script></body></html>
